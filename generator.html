<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор Скорборда PRO — Видеорендер</title>
    <!-- Библиотека для скриншотов -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Библиотека для сборки WebM видео -->
    <script src="https://cdn.jsdelivr.net/npm/whammy@0.0.1/whammy.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Playfair+Display:wght@700;900&family=Roboto:wght@400;700;900&family=Oswald:wght@400;700&family=Open+Sans:wght@400;700;800&family=Caveat:wght@700&family=Comfortaa:wght@700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --gold: #FFD700; --silver: #C0C0C0; --bronze: #CD7F32;
            --bg-dark: #0a0a1a; --accent1: #7B2FBE; --accent2: #E91E8C; --accent3: #00D4FF;
            --text-primary: #ffffff; --text-secondary: #b0b0cc;
        }

        body { font-family: 'Montserrat', sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; overflow-x: hidden; }

        header { text-align: center; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(10,10,26,0.9); z-index: 10; position: relative; }
        h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 900; background: linear-gradient(135deg, var(--gold), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; margin: 0; }
        
        .admin-login-btn { position: absolute; top: 15px; right: 20px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .admin-login-btn:hover { background: rgba(255,255,255,0.2); }

        .app-container { display: flex; flex-wrap: wrap; gap: 20px; max-width: 1600px; margin: 0 auto; padding: 20px; align-items: flex-start; }

        /* ЛИПКИЕ ПАНЕЛИ (Ездят при прокрутке) */
        .controls-panel { 
            flex: 1; min-width: 350px; max-width: 530px; background: rgba(18, 18, 42, 0.7); 
            border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; 
            position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow-y: auto;
        }
        
        .preview-panel { 
            flex: 2; display: flex; flex-direction: column; align-items: center; min-width: 300px; 
            position: sticky; top: 20px;
        }

        /* Кастомизация скроллбара в настройках */
        .controls-panel::-webkit-scrollbar { width: 6px; }
        .controls-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        .section-title { font-size: 1rem; color: var(--accent3); margin: 20px 0 10px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .section-title:first-child { margin-top: 0; }

        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        .control-group { display: flex; flex-direction: column; justify-content: flex-end; position: relative; }
        .control-group label { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 5px; text-transform: uppercase; font-weight: 600; }
        .control-group input[type="text"], .control-group select, .control-group input[type="file"], .control-group input[type="number"] { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: white; font-family: 'Montserrat', sans-serif; }
        
        .control-row { display: flex; gap: 10px; align-items: center; margin-top: 5px; }
        .control-row input[type="color"] { flex-shrink: 0; padding: 0; width: 40px; height: 35px; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; cursor: pointer; background: transparent; }
        .control-row input[type="range"] { flex: 1; accent-color: var(--accent3); }

        .checkbox-group { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.8rem; font-weight: 600; color: white; }
        .checkbox-group input { width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent2); }

        .btn-action { background: rgba(255,255,255,0.1); color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-weight: 600; width: 100%; }
        .btn-action:hover { background: rgba(255,255,255,0.2); }
        .btn-auto-color { background: rgba(0, 212, 255, 0.15); color: var(--accent3); border: 1px solid rgba(0, 212, 255, 0.3); padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 700; cursor: pointer; transition: 0.2s; white-space: nowrap; }

        .btn-render-vid { background: linear-gradient(135deg, #FF416C, #FF4B2B); color: white; font-size: 1rem; padding: 15px; box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4); border:none; border-radius: 8px; font-weight: 800; cursor: pointer; transition: 0.3s; text-transform: uppercase; width: 100%; margin-top: 15px; letter-spacing: 1px;}
        .btn-render-vid:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(255, 65, 108, 0.6); }

        .participants-editor { display: flex; flex-direction: column; gap: 8px; margin: 15px 0; }
        
        .editor-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
        .editor-row select { flex: 1; min-width: 90px; padding: 6px; border-radius: 6px; background: rgba(255,255,255,0.1); color: white; border: none; font-size: 0.8rem; }
        .editor-row input { flex: 1; min-width: 70px; padding: 6px; border-radius: 6px; background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.1); font-size: 0.8rem; }
        .editor-row input[type="number"] { flex: 0.5; min-width: 45px; }
        
        .btn-icon { background: rgba(255,255,255,0.1); border:none; color: white; border-radius: 4px; cursor:pointer; width:22px; height:18px; font-size:10px; display:flex; align-items:center; justify-content:center; }
        .btn-remove { background: #ff4d4d; color: white; border: none; width: 30px; height: 30px; border-radius: 6px; cursor: pointer; font-weight: bold; flex-shrink: 0; }

        /* Окно превью */
        .preview-wrapper { width: 100%; position: relative; display: flex; justify-content: center; }

        #scoreboard-capture {
            position: absolute; top: 0; left: 0; transform-origin: top center;
            background: #0a0a1a; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            overflow: hidden; display: flex; flex-direction: column;
            font-family: var(--custom-font, 'Montserrat'), sans-serif;
        }

        .bg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .bg-layer-blur { background-size: cover; background-position: center; filter: blur(30px) brightness(0.6); transform: scale(1.1); }
        .bg-layer-clear { background-size: contain; background-repeat: no-repeat; background-position: center; opacity: 0.9; }
        .bg-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0, var(--bg-darken, 0.2)); z-index: 0; }
        
        /* Видео фон */
        #bgVideo { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }

        .capture-inner {
            position: relative; z-index: 1; width: 100%; height: 100%;
            padding: var(--pad-y, 40px) var(--pad-x, 40px);
            display: flex; flex-direction: column; transform-origin: center center;
        }

        .board-header { text-align: center; margin-bottom: 25px; }
        .board-title { font-family: var(--font-title, 'Playfair Display'), serif; font-size: calc(clamp(1.5rem, 4vw, 3rem) * var(--text-scale, 1)); font-weight: 900; color: white; line-height: 1.2; text-transform: var(--text-case, uppercase); }
        .board-subtitle { color: var(--gold); font-family: var(--font-title, 'Playfair Display'), serif; font-size: calc(clamp(0.8rem, 2vw, 1.2rem) * var(--text-scale, 1)); text-transform: var(--text-case, uppercase); letter-spacing: 4px; font-weight: 700; margin-top: 5px; }

        .board-results { display: grid; gap: calc(12px * var(--bar-scale, 1)); align-content: start; flex: 1; position: relative; }

        .result-row { display: flex; align-items: center; font-family: var(--font-board, 'Montserrat'), sans-serif; text-transform: var(--text-case, uppercase); position: absolute; width: 100%; left: 0; top: 0; }
        
        .position { display: flex; align-items: center; justify-content: center; font-weight: 900; flex-shrink: 0; transform: translate(var(--pos-x, 0px), var(--pos-y, 0px)); }
        .participant-avatar { object-fit: cover; flex-shrink: 0; background: #2a2a4a; border-radius: var(--avatar-radius, 50%); transform: translate(var(--ava-x, 0px), var(--ava-y, 0px)); }
        
        .participant-info { flex: 1; display: flex; flex-direction: column; overflow: hidden; white-space: nowrap; margin-right: 10px; transform: translate(var(--name-x, 0px), var(--name-y, 0px)); text-align: var(--text-align, left); align-items: var(--align-flex, flex-start); justify-content: center; }
        .participant-name { font-weight: 700; text-overflow: ellipsis; overflow: hidden; }
        .participant-note { color: var(--text-secondary); text-overflow: ellipsis; overflow: hidden; font-size: 0.85em; }
        
        .score { text-align: right; flex-shrink: 0; transform: translate(var(--score-x, 0px), var(--score-y, 0px)); position: relative; }
        .score-number { font-weight: 900; line-height: 1; display: inline-block; }
        .score-label { font-size: calc(0.65rem * var(--text-scale, 1)); color: var(--text-secondary); text-transform: uppercase; }

        /* Floating Add Score Text */
        .add-score-float { position: absolute; right: 10px; top: 10px; font-size: 1.5rem; font-weight: 900; color: #00ff88; text-shadow: 0 0 10px rgba(0,255,136,0.8); opacity: 0; pointer-events: none; z-index: 10; }

        /* Золотая плашка (7+ баллов) */
        .is-gold {
            background: var(--gold) !important;
            border-color: #FFA500 !important;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.6) !important;
            color: #000 !important;
        }
        .is-gold .participant-name, .is-gold .score-number { color: #000 !important; }
        .is-gold .participant-note, .is-gold .score-label { color: #333 !important; }
        .is-gold .position { background: #fff !important; color: #000 !important; }

        /* СТАЯВИДЕНИЕ */
        .style-stayavision .result-row { padding: calc(12px * var(--bar-h-mult, 1) * var(--bar-scale, 1)) calc(20px * var(--bar-scale, 1)); border-radius: calc(12px * var(--bar-scale, 1)); background: linear-gradient(90deg, var(--bar-c1), var(--bar-c2)); border: 1px solid rgba(255,255,255,0.05); }
        .style-stayavision .position { width: calc(45px * var(--bar-scale, 1)); height: calc(45px * var(--bar-scale, 1)); font-size: calc(1.2rem * var(--text-scale, 1)); margin-right: calc(15px * var(--bar-scale, 1)); background: rgba(255,255,255,0.1); color: white; }
        .style-stayavision .participant-avatar { width: calc(50px * var(--bar-scale, 1) * var(--avatar-size, 1)); height: calc(50px * var(--bar-scale, 1) * var(--avatar-size, 1)); margin-right: calc(15px * var(--bar-scale, 1)); border: 2px solid rgba(255,255,255,0.1); }
        .style-stayavision .participant-name { font-size: calc(1.3rem * var(--text-scale, 1)); color: #fff; }
        .style-stayavision .score-number { font-size: calc(1.8rem * var(--text-scale, 1)); color: #fff; }

        /* ЕВРОВИДЕНИЕ */
        .style-eurovision .result-row { padding: calc(6px * var(--bar-h-mult, 1) * var(--bar-scale, 1)) calc(12px * var(--bar-scale, 1)); background: linear-gradient(90deg, var(--bar-c1), var(--bar-c2)); border-radius: 4px; border: 1px solid rgba(255,255,255,0.05); border-left: calc(4px * var(--bar-scale, 1)) solid var(--accent3); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .style-eurovision .position { width: calc(35px * var(--bar-scale, 1)); height: calc(35px * var(--bar-scale, 1)); font-size: calc(1.1rem * var(--text-scale, 1)); margin-right: calc(12px * var(--bar-scale, 1)); border-right: 1px solid rgba(255,255,255,0.2); padding-right: 10px; justify-content: flex-start; color: #fff; }
        .style-eurovision .participant-avatar { width: calc(35px * var(--bar-scale, 1) * var(--avatar-size, 1)); height: calc(35px * var(--bar-scale, 1) * var(--avatar-size, 1)); margin-right: calc(12px * var(--bar-scale, 1)); }
        .style-eurovision .participant-name { font-size: calc(1.1rem * var(--text-scale, 1)); color: #fff; letter-spacing: 1px; }
        .style-eurovision .score-number { font-size: calc(1.5rem * var(--text-scale, 1)); color: var(--accent3); }

        /* СПЛИТ-СКРИН */
        .style-splitscreen .result-row { flex-direction: column; text-align: center; justify-content: center; padding: calc(30px * var(--bar-h-mult, 1) * var(--bar-scale, 1)); border-radius: 20px; background: linear-gradient(180deg, var(--bar-c1), var(--bar-c2)); border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .style-splitscreen .participant-avatar { width: calc(150px * var(--bar-scale, 1) * var(--avatar-size, 1)); height: calc(150px * var(--bar-scale, 1) * var(--avatar-size, 1)); margin: 0 auto 15px auto; border: 3px solid rgba(255,255,255,0.1); }
        .style-splitscreen .participant-info { margin: 0 0 15px 0; align-items: center !important; text-align: center !important; }
        .style-splitscreen .participant-name { font-size: calc(1.8rem * var(--text-scale, 1)); color: #fff; }
        .style-splitscreen .score { margin: 0; text-align: center; }
        .style-splitscreen .score-number { font-size: calc(3rem * var(--text-scale, 1)); color: #fff; }
        .style-splitscreen .position { position: absolute; top: 15px; left: 15px; width: calc(40px * var(--bar-scale, 1)); height: calc(40px * var(--bar-scale, 1)); background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; margin: 0; }

        /* Loading Overlay */
        #renderOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index: 9999; display:none; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .progress-bar { width: 300px; height: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; margin-top: 20px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent3); width: 0%; transition: width 0.1s; }
    </style>
</head>
<body>
    <header><h1>Генератор Скорборда PRO</h1></header>

    <div class="app-container">
        <!-- НАСТРОЙКИ -->
        <div class="controls-panel">
            <div class="section-title">Текст и Формат</div>
            <div class="settings-grid">
                <div class="control-group"><label>Заголовок</label><input type="text" id="inTitle" oninput="updateState('title', this.value)"></div>
                <div class="control-group"><label>Подзаголовок</label><input type="text" id="inSubtitle" oninput="updateState('subtitle', this.value)"></div>
                <div class="control-group">
                    <label>Разрешение</label>
                    <select id="inRatio" onchange="updateState('aspectRatio', this.value)">
                        <option value="16/9">16:9 (YouTube)</option><option value="9/16">9:16 (TikTok/Shorts)</option><option value="1/1">1:1 (Квадрат)</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Шрифт заголовка</label>
                    <select id="inFontTitle" onchange="updateState('fontTitle', this.value)"><option value="Playfair Display">Playfair Display</option><option value="Montserrat">Montserrat</option></select>
                </div>
            </div>

            <div class="section-title">Дизайн и Цвета</div>
            <div class="settings-grid">
                <div class="control-group"><label>Стиль</label><select id="inStyle" onchange="updateState('style', this.value)"><option value="stayavision">Стаявидение</option><option value="eurovision">Eurovision</option><option value="splitscreen">Сплит-скрин</option></select></div>
                <div class="control-group">
                    <label>Стиль Анимации (Сдвиг)</label>
                    <select id="inAnim" onchange="updateState('animStyle', this.value)">
                        <option value="smooth">Плавный (Кино)</option>
                        <option value="bounce">Пружинистый</option>
                    </select>
                </div>
            </div>

            <div class="control-group" style="margin-top:10px;">
                <label>Градиент плашек</label>
                <div class="control-row">
                    <input type="color" id="inBarColor1" oninput="updateState('barColor1', this.value)">
                    <input type="color" id="inBarColor2" oninput="updateState('barColor2', this.value)">
                    <input type="range" id="inBarAlpha" min="0" max="1" step="0.05" oninput="updateState('barAlpha', this.value)">
                </div>
            </div>

            <div class="section-title">Макет и Фон</div>
            <div class="settings-grid">
                <div class="control-group"><label>Отступ X</label><input type="range" id="inPadX" min="0" max="200" oninput="updateState('padX', this.value)"></div>
                <div class="control-group"><label>Отступ Y</label><input type="range" id="inPadY" min="0" max="200" oninput="updateState('padY', this.value)"></div>
                <div class="control-group">
                    <label>Фон (Изображение / Видео)</label>
                    <select id="inBgType" onchange="updateState('bgType', this.value)">
                        <option value="none">Тёмная заливка</option>
                        <option value="wolfs.jpg">Волки (Картинка)</option>
                        <option value="custom">Свой файл...</option>
                    </select>
                    <input type="file" id="inBgCustom" style="display:none;" accept="image/*,video/*" onchange="handleBgUpload(event)">
                </div>
            </div>

            <!-- РЕНДЕР ВИДЕО -->
            <div class="section-title" style="color: #ff4d4d; margin-top: 30px;">Экспорт (WebM 30 FPS)</div>
            <p style="font-size:0.75rem; color: var(--text-secondary);">Укажите баллы в колонке "+ Добавить". Программа покадрово создаст видео анимации начисления и смены мест. Это займёт 10-30 секунд.</p>
            <button class="btn-render-vid" onclick="exportVideo()">🎬 СКАЧАТЬ ВИДЕО (WebM)</button>

            <!-- Участники -->
            <div style="display: flex; font-size: 0.7rem; color: var(--text-secondary); text-transform: uppercase; font-weight: 700; margin-top: 25px; padding-left: 35px;">
                <div style="flex:1; min-width: 90px;">Участник / Аватар</div>
                <div style="flex:1; min-width: 70px; margin-left:10px;">Балл</div>
                <div style="flex:0.8; min-width: 50px; color: #00ff88; margin-left:10px;">+ Добавить</div>
            </div>
            <div class="participants-editor" id="editorContainer"></div>
            <button class="btn-action" style="border: 1px dashed var(--accent3); color: var(--accent3); background: transparent;" onclick="addParticipant()">+ ДОБАВИТЬ УЧАСТНИКА</button>
        </div>

        <!-- ПРЕВЬЮ -->
        <div class="preview-panel">
            <div class="preview-wrapper" id="previewWrapper">
                <div id="scoreboard-capture">
                    
                    <div class="bg-layer bg-layer-blur" id="bgBlur"></div>
                    <div class="bg-layer bg-layer-clear" id="bgClear"></div>
                    
                    <!-- Скрытое видео для захвата кадров -->
                    <video id="bgVideoObj" loop muted playsinline style="display:none;"></video>
                    
                    <div class="bg-overlay"></div>
                    
                    <div class="capture-inner" id="captureInner">
                        <div class="board-header">
                            <div class="board-title" id="renderTitle"></div>
                            <div class="board-subtitle" id="renderSubtitle"></div>
                        </div>
                        <!-- Абсолютное позиционирование внутри -->
                        <div class="board-results" id="renderBoard" style="position: relative;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Загрузочный экран -->
    <div id="renderOverlay">
        <h2 style="font-family: Montserrat;">Рендеринг видео...</h2>
        <p id="renderStatus" style="color: var(--accent3); margin-top: 10px;">Подготовка</p>
        <div class="progress-bar"><div class="progress-fill" id="renderProgress"></div></div>
    </div>

    <script>
        const DEFAULT_STATE = {
            title: "Стаявидение 6", subtitle: "Финал", style: "stayavision", animStyle: "smooth",
            aspectRatio: "16/9", customW: 1920, customH: 1080, columns: 1, fontTitle: "Playfair Display", fontBoard: "Montserrat",
            textUppercase: true, bgType: "none", bgCustomData: "", bgIsVideo: false, padX: 40, padY: 40, scale: 1, textScale: 1, barScale: 1,
            showNotes: true, showPositions: true, showAvatars: true, showScores: true, avatarShape: "50%",
            barColor1: "#2a1b42", barColor2: "#0a0a1a", barAlpha: 0.85, 
            nameX: 0, nameY: 0, scoreX: 0, scoreY: 0, posX: 0, posY: 0, avaX: 0, avaY: 0, align: "left", avatarSize: 1, barHeightMultiplier: 1,
            participants: [
                { id: 1, name: "Обалена", score: 16, addScore: 0, note: "", avatar: "default.jpg" }, 
                { id: 2, name: "Ритикс", score: 14, addScore: 0, note: "", avatar: "default.jpg" },
                { id: 3, name: "Гира", score: 12, addScore: 12, note: "ПРИМЕР ТЕСТА", avatar: "default.jpg" }, 
                { id: 4, name: "Егорь", score: 8, addScore: 0, note: "", avatar: "default.jpg" }
            ]
        };

        let state = JSON.parse(JSON.stringify(DEFAULT_STATE));
        let layoutData = []; // Хранит Y-координаты для каждой строки

        function hexToRgba(hex, alpha) { let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16); return `rgba(${r}, ${g}, ${b}, ${alpha})`; }

        function init() { syncUI(); renderEditor(); updatePreview(); window.addEventListener('resize', adjustMobileScale); }

        function syncUI() {
            document.getElementById('inTitle').value = state.title; document.getElementById('inSubtitle').value = state.subtitle;
            document.getElementById('inRatio').value = state.aspectRatio; 
            document.getElementById('inStyle').value = state.style; document.getElementById('inAnim').value = state.animStyle;
            document.getElementById('inBarColor1').value = state.barColor1; document.getElementById('inBarColor2').value = state.barColor2;
            document.getElementById('inPadX').value = state.padX; document.getElementById('inPadY').value = state.padY;
        }

        function updateState(key, value) { state[key] = value; updatePreview(); }
        function updateParticipant(id, field, value) { const p = state.participants.find(x => x.id === id); if(p) { p[field] = field === 'score' || field === 'addScore' ? Number(value) : value; updatePreview(); } }
        
        function moveParticipant(id, dir) {
            const idx = state.participants.findIndex(p => p.id === id); if (idx < 0) return;
            const nIdx = idx + dir; if (nIdx < 0 || nIdx >= state.participants.length) return;
            [state.participants[idx], state.participants[nIdx]] = [state.participants[nIdx], state.participants[idx]];
            renderEditor(); updatePreview();
        }

        function handleBgUpload(e) { 
            const f = e.target.files[0]; 
            if(f) { 
                state.bgIsVideo = f.type.startsWith('video/');
                const r = new FileReader(); 
                r.onload = ev => { 
                    state.bgCustomData = ev.target.result; 
                    if(state.bgIsVideo) {
                        let vid = document.getElementById('bgVideoObj');
                        vid.src = state.bgCustomData;
                        vid.play(); // Для превью
                    }
                    updatePreview(); 
                }; 
                r.readAsDataURL(f); 
            } 
        }

        function renderEditor() {
            const container = document.getElementById('editorContainer'); container.innerHTML = '';
            state.participants.forEach((p) => {
                container.innerHTML += `
                    <div class="editor-row">
                        <div style="display:flex; flex-direction:column; gap:2px; margin-right: 2px;">
                            <button type="button" class="btn-icon" onclick="moveParticipant(${p.id}, -1)">▲</button>
                            <button type="button" class="btn-icon" onclick="moveParticipant(${p.id}, 1)">▼</button>
                        </div>
                        <input type="text" style="flex:1.5; min-width: 70px;" placeholder="Имя" value="${p.name}" oninput="updateParticipant(${p.id}, 'name', this.value)">
                        <input type="number" style="flex:0.8; min-width: 45px;" placeholder="Балл" value="${p.score}" oninput="updateParticipant(${p.id}, 'score', this.value)">
                        <input type="number" style="flex:0.8; min-width: 45px; background: rgba(0,255,136,0.1); border-color: rgba(0,255,136,0.3); color: #00ff88; font-weight:bold;" placeholder="+ Добав." value="${p.addScore || 0}" oninput="updateParticipant(${p.id}, 'addScore', this.value)">
                    </div>`;
            });
        }

        function addParticipant() { const nId = state.participants.length>0 ? Math.max(...state.participants.map(p=>p.id))+1 : 1; state.participants.push({ id: nId, name: "Новый", score: 0, addScore: 0, note: "", avatar: "default.jpg" }); renderEditor(); updatePreview(); }

        // === ГЕНЕРАЦИЯ МАКЕТА ===
        // Эта функция просто строит HTML, но позиционирует всё АБСОЛЮТНО (top/left) на основе сетки
        function updatePreview() {
            document.getElementById('renderTitle').innerText = state.title; document.getElementById('renderSubtitle').innerText = state.subtitle;
            const capture = document.getElementById('scoreboard-capture'); const inner = document.getElementById('captureInner');
            
            // Задаем жесткий размер для рендера (1280x720 для 16:9, чтобы рендер был быстрым и качественным)
            let w = 1280, h = 720;
            if(state.aspectRatio === '9/16') { w = 720; h = 1280; }
            if(state.aspectRatio === '1/1') { w = 1000; h = 1000; }
            capture.style.width = w + 'px'; capture.style.height = h + 'px';
            
            capture.className = `style-${state.style}`;
            capture.style.setProperty('--bar-c1', hexToRgba(state.barColor1, state.barAlpha)); 
            capture.style.setProperty('--bar-c2', hexToRgba(state.barColor2, state.barAlpha * 0.7));
            inner.style.setProperty('--pad-x', state.padX + 'px'); inner.style.setProperty('--pad-y', state.padY + 'px');

            // Фон
            let bgUrl = (state.bgType === 'custom' && !state.bgIsVideo) ? state.bgCustomData : (state.bgType !== 'none' && state.bgType !== 'custom' ? state.bgType : "");
            
            if(state.bgIsVideo && state.bgCustomData) {
                // Если видео - берем текущий кадр из скрытого video tag
                let vid = document.getElementById('bgVideoObj');
                let c = document.createElement('canvas'); c.width = w; c.height = h;
                c.getContext('2d').drawImage(vid, 0,0, w, h);
                bgUrl = c.toDataURL();
            }

            document.getElementById('bgBlur').style.backgroundImage = bgUrl ? `url('${bgUrl}')` : 'none';
            document.getElementById('bgClear').style.backgroundImage = bgUrl ? `url('${bgUrl}')` : 'none';

            // Отрисовка участников
            const board = document.getElementById('renderBoard');
            board.innerHTML = '';
            
            let list = [...state.participants].sort((a,b) => b.score - a.score);
            let maxScore = Math.max(...list.map(p => p.score + (p.addScore || 0)), 1);

            // Так как мы используем абсолютное позиционирование, нам нужно вычислить Y-сдвиг для каждой строки
            // Это делается математически:
            let rowHeight = state.style === 'splitscreen' ? 180 : 80;
            let gap = 12;
            
            // Сохраняем логические координаты для рендера анимации
            layoutData = list.map((p, index) => {
                return {
                    id: p.id,
                    startY: index * (rowHeight + gap), // Начальная позиция (до баллов)
                    endY: 0, // Вычислим позже
                    pData: p
                };
            });

            // Вычисляем конечные Y-позиции (после прибавления баллов)
            let finalList = [...state.participants].sort((a,b) => (b.score+b.addScore) - (a.score+a.addScore));
            layoutData.forEach(ld => {
                let finalIndex = finalList.findIndex(x => x.id === ld.id);
                ld.endY = finalIndex * (rowHeight + gap);
            });

            // Отрисовываем DOM элементы с абсолютным top (по умолчанию startY)
            layoutData.forEach((ld, index) => {
                let p = ld.pData;
                let position = index + 1; // Начальное место
                
                let sb = `
                    <div class="score">
                        <div class="add-score-float" id="float-${p.id}">+${p.addScore} БАЛЛОВ</div>
                        <div class="score-number" id="scoreNum-${p.id}">${p.score}</div>
                    </div>`;

                board.innerHTML += `
                    <div class="result-row" id="row-${p.id}" style="top: ${ld.startY}px; height: ${rowHeight}px;">
                        <div class="position" id="pos-${p.id}">${position}</div>
                        <img src="${p.avatar}" class="participant-avatar" alt="av">
                        <div class="participant-info"><div class="participant-name">${p.name}</div></div>
                        ${sb}
                    </div>`;
            });

            setTimeout(adjustMobileScale, 10);
        }

        function adjustMobileScale() {
            const capture = document.getElementById('scoreboard-capture'); const wrapper = document.getElementById('previewWrapper');
            if(!capture || !wrapper || capture.offsetWidth === 0) return;
            let scale = Math.min(wrapper.clientWidth / capture.offsetWidth, 1);
            capture.style.transform = `scale(${scale})`; wrapper.style.height = (capture.offsetHeight * scale) + 'px';
        }

        // === МАТЕМАТИКА АНИМАЦИИ (Easing) ===
        function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
        function easeOutElastic(x) { const c4 = (2 * Math.PI) / 3; return x === 0 ? 0 : x === 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - 0.75) * c4) + 1; }

        // === ПОКАДРОВЫЙ РЕНДЕР WEBM (МАГИЯ!) ===
        async function exportVideo() {
            const hasPointsToAdd = state.participants.some(p => p.addScore > 0);
            if (!hasPointsToAdd) { alert("Сначала укажите баллы (+ Добавить)!"); return; }

            const overlay = document.getElementById('renderOverlay');
            const pFill = document.getElementById('renderProgress');
            const pStatus = document.getElementById('renderStatus');
            overlay.style.display = 'flex';
            pFill.style.width = '0%';
            
            // Настройки видео
            const fps = 30;
            const framesScore = 60; // 2 секунды - бегут цифры
            const framesPause1 = 15; // 0.5 сек - пауза
            const framesMove = 45;   // 1.5 сек - движение мест
            const framesPause2 = 30; // 1 сек - пауза в конце
            const totalFrames = framesScore + framesPause1 + framesMove + framesPause2; // Всего 150 кадров (5 сек видео)

            let video = new Whammy.Video(fps);
            let captureDiv = document.getElementById('scoreboard-capture');
            let bgVid = document.getElementById('bgVideoObj');

            // Подготавливаем начальные данные
            let list = [...state.participants];
            let maxTotal = Math.max(...list.map(p => p.score + (p.addScore||0)), 1);

            for(let frame = 0; frame < totalFrames; frame++) {
                pStatus.innerText = `Рендер кадра ${frame + 1} из ${totalFrames}...`;
                pFill.style.width = ((frame / totalFrames) * 100) + '%';

                // Если фон это видео, перематываем его покадрово!
                if(state.bgIsVideo) {
                    bgVid.currentTime = frame / fps;
                    let c = document.createElement('canvas'); c.width = captureDiv.offsetWidth; c.height = captureDiv.offsetHeight;
                    c.getContext('2d').drawImage(bgVid, 0,0, c.width, c.height);
                    document.getElementById('bgClear').style.backgroundImage = `url(${c.toDataURL()})`;
                }

                // Логика фазы
                layoutData.forEach(ld => {
                    let p = ld.pData;
                    let numEl = document.getElementById(`scoreNum-${p.id}`);
                    let floatEl = document.getElementById(`float-${p.id}`);
                    let rowEl = document.getElementById(`row-${p.id}`);

                    if(frame <= framesScore) {
                        // ФАЗА 1: Начисление баллов
                        let prog = frame / framesScore;
                        if(p.addScore > 0) {
                            let curr = Math.floor(p.score + (p.addScore * prog));
                            numEl.innerText = curr;
                            
                            // Всплывающий текст "+ Х"
                            let op = prog < 0.2 ? prog*5 : (prog > 0.8 ? (1-prog)*5 : 1);
                            let yShift = prog * -30;
                            floatEl.style.opacity = op;
                            floatEl.style.transform = `translateY(${yShift}px)`;

                            // Золотая плашка (Если > 7 баллов)
                            if(prog > 0.5 && p.addScore >= 7) { rowEl.classList.add('is-gold'); }
                        }
                    } 
                    else if (frame > framesScore + framesPause1 && frame <= framesScore + framesPause1 + framesMove) {
                        // ФАЗА 3: Движение строк
                        floatEl.style.opacity = 0; // Прячем текст +Х
                        rowEl.classList.remove('is-gold'); // Убираем золото

                        let prog = (frame - (framesScore + framesPause1)) / framesMove;
                        let eased = state.animStyle === 'bounce' ? easeOutElastic(prog) : easeOutCubic(prog);
                        
                        let currentY = ld.startY + ((ld.endY - ld.startY) * eased);
                        rowEl.style.top = currentY + 'px';
                        
                        // Смена номера места на лету, если обгоняет
                        // Просчет места в текущем кадре слишком сложен, просто перепишем места в конце.
                    }
                    else if (frame > framesScore + framesPause1 + framesMove) {
                        // ФАЗА 4: Финал (просто статичная пауза)
                        rowEl.style.top = ld.endY + 'px';
                        
                        // Обновляем цифру места
                        let finalIndex = [...state.participants].sort((a,b)=>(b.score+b.addScore)-(a.score+a.addScore)).findIndex(x=>x.id===p.id);
                        document.getElementById(`pos-${p.id}`).innerText = finalIndex + 1;
                    }
                });

                // ДЕЛАЕМ СКРИНШОТ
                // Ждем 1 миллисекунду, чтобы браузер применил CSS
                await new Promise(r => setTimeout(r, 1));
                
                const canvas = await html2canvas(captureDiv, { 
                    scale: 1, // Scale 1 (1280x720) - идеально для быстрого рендера HD
                    backgroundColor: null, logging: false, useCORS: true 
                });

                // Конвертируем в WEBP и добавляем в видео
                video.add(canvas.toDataURL('image/webp', 0.9));
            }

            pStatus.innerText = "Сборка видеофайла (Мультиплексинг)...";
            
            // Компиляция WebM и скачивание
            video.compile(false, function(output) {
                const url = URL.createObjectURL(output);
                const a = document.createElement('a');
                a.style.display = 'none'; a.href = url; a.download = `${state.title}_Anim.webm`;
                document.body.appendChild(a); a.click();
                window.URL.revokeObjectURL(url);
                
                // Возвращаем UI в норму
                overlay.style.display = 'none';
                
                // Обновляем баллы навсегда
                state.participants.forEach(p => { if(p.addScore > 0) { p.score += p.addScore; p.addScore = 0; } });
                updatePreview(); renderEditor();
            });
        }

        init();
    </script>
</body>
</html>
